name = "public-data-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 격자+발표시각 공유 캐시 및 "마지막 정상 응답" fallback 저장소.
# `npx wrangler kv namespace create PROXY_CACHE`로 만든 뒤 출력된 id로 교체한다.
[[kv_namespaces]]
binding = "PROXY_CACHE"
id = "a20bd4217fd74fa48b3cfe4e02839b12"

# Workers Logs: 대시보드에서 에러코드(22 한도 초과, 30 미등록 키 등) 로그를 볼 수 있게 한다.
# 요청별 메타데이터(IP·헤더 등) 기록은 끄고 코드에서 남기는 console 로그만 보관한다.
[observability.logs]
enabled = true
invocation_logs = false

[vars]
# 로컬 개발(localhost/127.0.0.1) Origin 허용 여부. 실서비스 안정화 후 "false" 권장.
ALLOW_DEV_ORIGINS = "true"

# 비밀값(서비스키)은 여기 쓰지 않는다 →
#   `npx wrangler secret put KMA_SERVICE_KEY`      (기상청 단기예보, 오늘의 빨래지수)
#   `npx wrangler secret put HOLIDAY_SERVICE_KEY`  (한국천문연구원 특일 정보, 연휴계산기)
